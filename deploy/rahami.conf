# Nginx Reverse Proxy Configuration for Rahami — رهامي

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name rahami.yourdomain.com;

    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rahami.yourdomain.com;

    # SSL Certificates (managed via Certbot or custom certificate)
    ssl_certificate /etc/letsencrypt/live/rahami.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rahami.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum file size allowance for transfers
    client_max_body_size 300M;

    # Proxy to FastAPI Uvicorn Backend
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # WebSocket & Long-polling headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for media downloads
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
}
